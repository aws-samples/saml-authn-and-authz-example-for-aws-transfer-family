# Dependabot configuration.
#
# Security updates are enabled in the repository settings. This file makes
# Dependabot PR titles follow Conventional Commits ("chore(deps): ..." /
# "chore(deps-dev): ...") so they pass the pull-request-lint workflow
# (amannn/action-semantic-pull-request, allowed types: feat, fix, chore).
# With include: "scope", Dependabot appends "(deps)" or "(deps-dev)" to the
# prefix.
#
# Minor and patch version updates are grouped into one PR per ecosystem.
# Major updates arrive as separate PRs so they can be tested on their own.
#
# Note: package.json files are generated by projen from .projenrc.ts. If a
# Dependabot PR changes a version range in package.json, mirror that change in
# .projenrc.ts so the next projen run does not revert it.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/infrastructure"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
