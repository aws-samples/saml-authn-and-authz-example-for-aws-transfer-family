# Dependabot configuration.
#
# Security updates are enabled in the repository settings. This file makes
# Dependabot PR titles follow Conventional Commits ("chore(deps): ..." /
# "chore(deps-dev): ...") so they pass the pull-request-lint workflow
# (amannn/action-semantic-pull-request, allowed types: feat, fix, chore).
# With include: "scope", Dependabot appends "(deps)" or "(deps-dev)" to the
# prefix.
#
# npm: the repo is one pnpm workspace with a single pnpm-lock.yaml at the root,
# so only "/" is watched (packages/infrastructure is a workspace member).
# The package.json files are generated by projen from .projenrc.ts, so
# Dependabot is limited to lockfile-only updates: it moves resolved versions
# within the ranges projen writes and never edits package.json. Updates that
# need a range change (major versions, or anything outside the current range)
# get no Dependabot PR; make those in .projenrc.ts and re-run projen.
# All npm lockfile updates are grouped into one PR. The npm group has no
# update-types filter on purpose: Dependabot checks a group's update-types
# against the newest release on the registry, not the in-range version that
# lockfile-only actually installs. A dependency with a newer major release
# (e.g. typescript 7.x while the range is ^5) was rejected from a
# minor/patch group and got its own PR, even though its update was in-range.
#
# github-actions: .github/workflows/pull-request-lint.yml is also generated by
# projen. When Dependabot proposes a newer action version, apply it to the
# version constant in .projenrc.ts instead of merging the PR as-is, or the next
# projen run reverts it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-lockfile:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
